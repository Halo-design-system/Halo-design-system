<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      /* Figma's theme colours (themeColors: true), so the window follows light and dark. */
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        display: flex;
        flex-direction: column;
        font: 11px/16px Inter, system-ui, sans-serif;
        color: var(--figma-color-text);
        background: var(--figma-color-bg);
      }
      button { font: inherit; color: inherit; cursor: pointer; }
      header { padding: 12px 12px 8px; border-bottom: 1px solid var(--figma-color-border); }
      input {
        width: 100%;
        height: 32px;
        padding: 0 8px;
        font: inherit;
        color: var(--figma-color-text);
        background: var(--figma-color-bg-secondary);
        border: 1px solid transparent;
        border-radius: 6px;
        outline: none;
      }
      input::placeholder { color: var(--figma-color-text-tertiary); }
      input:focus { border-color: var(--figma-color-border-selected); }
      #banner {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
        margin: 8px 12px 0;
        padding: 8px 12px;
        background: var(--figma-color-bg-secondary);
        border-radius: 6px;
      }
      #banner[hidden] { display: none; }
      #banner p { margin: 0; }
      .secondary {
        height: 24px;
        padding: 0 8px;
        background: var(--figma-color-bg);
        border: 1px solid var(--figma-color-border);
        border-radius: 5px;
      }
      #list { flex: 1; overflow-y: auto; padding: 0 12px 12px; }
      h2 {
        margin: 16px 0 4px;
        font-size: 11px;
        font-weight: 600;
        color: var(--figma-color-text-secondary);
      }
      .item { border-radius: 6px; }
      .item:hover { background: var(--figma-color-bg-hover); }
      .row {
        display: flex;
        flex-direction: column;
        gap: 2px;
        width: 100%;
        padding: 8px;
        text-align: left;
        background: none;
        border: 0;
        border-radius: 6px;
      }
      .row:focus-visible, .chip:focus-visible, .secondary:focus-visible {
        outline: 2px solid var(--figma-color-border-selected);
        outline-offset: -2px;
      }
      .name { font-weight: 600; }
      .description { color: var(--figma-color-text-secondary); }
      .chips { display: flex; flex-wrap: wrap; gap: 4px; padding: 0 8px 8px; }
      .chip {
        height: 22px;
        padding: 0 8px;
        background: var(--figma-color-bg);
        border: 1px solid var(--figma-color-border);
        border-radius: 11px;
      }
      .chip:hover { border-color: var(--figma-color-border-strong); }
      .empty { padding: 24px 8px; text-align: center; color: var(--figma-color-text-secondary); }
      footer {
        min-height: 36px;
        padding: 10px 12px;
        border-top: 1px solid var(--figma-color-border);
        color: var(--figma-color-text-secondary);
      }
      footer[data-tone='error'] { color: var(--figma-color-text-danger); }
    </style>
  </head>
  <body>
    <header>
      <input id="search" type="search" placeholder="Search components, like date or table" aria-label="Search components" />
    </header>
    <div id="banner" hidden></div>
    <main id="list"></main>
    <footer id="status" role="status">Click a component to place it. Select a frame first to place it inside.</footer>
    <script>/*__UI_SCRIPT__*/</script>
  </body>
</html>
