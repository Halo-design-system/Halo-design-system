<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <!-- SVG for browsers that take it; ICO and PNG for Google Search, Safari and link previews; a solid square for iPhone home screens -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // iPhones zoom in on any field with text under 16px. Stopping the zoom there still lets people pinch to zoom.
      if (/iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1))
        document.querySelector('meta[name=viewport]').content += ', maximum-scale=1';
    </script>
    <title>Halo Design System</title>
    <meta name="description" content="An open-source design system: a Figma library and React components that match, token for token." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
